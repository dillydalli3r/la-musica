# la musica - Docker Compose template.
#
# Music folder: MLO_MUSIC_FOLDER is the folder INSIDE the container holding your
# library, and it must be the target of the bind mount below. Point the host
# side (./music) at your real library:
#
#   volumes:
#     - /path/to/your/music:/music      # Linux/macOS
#     - D:/Music:/music                 # Windows (Docker Desktop)
#
# Everything the app writes lives under /music/.mlo (data/, downloads/, trash/)
# — the tools the Dependencies page installs (beets, librosa, yt-dlp, ffmpeg,
# libjxl …) included, in /music/.mlo/tools. One bind mount carries all of it.
#
# Commands:
#   docker compose up -d --build     # build from source and start
#   docker compose logs -f           # follow the backend log
#   docker compose pull              # fetch the prebuilt GHCR image
#   docker compose up -d             # (re)start on that image
#   docker compose down              # stop and remove
#
# Automatic updates are ON by default: the watchtower service at the bottom
# checks the registry every 5 minutes and restarts this container when a new
# image appears, so a `docker compose pull` is something you never have to
# remember. (It was a nightly 04:00 cron; a release now lands while you are
# still reading its notes.)
#
# Two things worth knowing before it does that:
#   * it keeps every OTHER container on the host alone (the label on this
#     service plus WATCHTOWER_LABEL_ENABLE);
#   * it updates the IMAGE, so if you started with `--build` (a local build
#     tagged with the same name) the first check replaces your build with the
#     published one. To keep building from source, start just the app -
#     `docker compose up -d lamusica` - or comment the service out.
#
# How often it checks: WATCHTOWER_POLL_INTERVAL (seconds, default 300; 60 is
# the aggressive end and still just one manifest request per minute). To check
# inside a window instead, use the WATCHTOWER_SCHEDULE line in the service
# below - and comment the interval out, because watchtower REFUSES TO START
# when both are set ("Cannot define both interval and schedule").
#   WATCHTOWER_POLL_INTERVAL=60 docker compose up -d watchtower

# The compose project name is PINNED. It is derived from the FOLDER name
# otherwise, and this repo's folder has already been renamed once (la-musica ->
# MusicLibraryOptimizer -> back to la-musica): the middle name silently started a
# second project, and the volumes and networks compose names after the project
# went with it — that install's runtime-fetched tools were nowhere to be found
# while the real ones sat under the first project's name. (The named volume this
# file used to declare for those tools is gone: they live in /music/.mlo/tools
# now — see the mounts below — but the pin still matters for anything else
# compose creates.) With the name pinned, the volumes and the network follow the
# app, not the directory you happen to run compose from.
name: la-musica

services:
  lamusica:
    build: .
    image: ghcr.io/dillydalli3r/la-musica:latest
    container_name: la-musica
    ports:
      - "8000:8000"
      # Soulseek listen port. Sharing is not just the web UI: other users
      # BROWSE and DOWNLOAD from this share by connecting to the port the
      # Soulseek network publishes for you, which slskd opens inside the
      # container (Settings -> Soulseek -> Listen port, default 50000). Not
      # publishing it means your library is searchable but downloads from it
      # fail, which is the one thing a share is for.
      #
      # The two numbers must be the SAME port. The variable is the source of
      # truth for BOTH sides: the app reads MLO_SOULSEEK_LISTEN_PORT at startup
      # and writes it into its own config (server/main.py), which is what slskd
      # is then told to listen on — so changing it here is enough, and a
      # mismatch cannot be introduced from Settings (the app refuses a port
      # that the environment pins, and says where the pin lives). On the host,
      # forward that port to this machine as well if a router sits in front of
      # it — that is the half no publish line can do.
      #
      # ...AND A FORWARD IS ONLY WORTH THE ADDRESS IT SERVES. Peers are given
      # the address the Soulseek server sees your LOGIN come from, which is the
      # HOST's own route out — so when the host sends its traffic through a VPN
      # or a Tailscale exit node, that address is the VPN's egress and a forward
      # on the home router points at nothing anyone dials: the share's file count
      # still shows on other clients and browsing it fails. Nothing in the
      # container can read the host's routing table; compare the host's own
      # egress ("what is my IP" there, or curl https://api.ipify.org) with the
      # WAN address the router's admin page shows, and turn the exit node off for
      # the host while sharing (or split-route it so this app's traffic leaves by
      # the ISP line) when the two differ.
      #
      # ONE TCP PORT IS ALL OF IT. slskd's inbound side is a single TCP listener,
      # UDP is only ever outbound, and there is no second "obfuscated" port to
      # publish — an obfuscated route is a SoulseekQt feature slskd does not
      # implement, so a peer that tries one falls back to this port rather than
      # needing another. The app does not have to be trusted about this line
      # either: on a container it MEASURES it (a published port is accepted on
      # Docker's gateway from inside, an unpublished one is not, with the app's
      # own published port as the control) and says so as the *Published by the
      # host* row of Test port and, when it is wrong, as `listen_unpublished` on
      # the sharing card — so a missing or renumbered publish line is reported as
      # itself instead of as a router that will not answer.
      - "${MLO_SOULSEEK_LISTEN_PORT:-50000}:${MLO_SOULSEEK_LISTEN_PORT:-50000}"
    environment:
      # Folder inside the container to treat as the music library.
      - MLO_MUSIC_FOLDER=/music
      # The address the server binds — and therefore whether the login gate
      # applies: a non-loopback bind turns it ON for CLIENTS (server/auth.py).
      # The image sets this already; it is repeated here because this is the
      # line that decides whether the published port is protected. Opening
      # localhost:8000 on THIS machine is not a client (the request arrives
      # through the Docker bridge gateway), so a single-user container needs no
      # password until a phone or another computer connects — set one under
      # Settings -> Security when it does.
      - MLO_SERVER_HOST=0.0.0.0
      # The Soulseek listen port, when you need a different one. Set it here
      # (or in a .env beside this file) and the publish line above follows the
      # same value, while the app seeds its own `soulseek_listen_port` from it —
      # one number on both sides. Uncomment and change both places in one move:
      #   - MLO_SOULSEEK_LISTEN_PORT=50000
    volumes:
      # ALL app state (config.json, playlists.db + wishes.db, slskd.yaml,
      # the beets config + beets-library.db, and the ReplayGain / RYM /
      # metadata caches) lives in /music/.mlo/data, beside the transient
      # /music/.mlo/downloads and /music/.mlo/trash AND the tools the
      # Dependencies page installs (/music/.mlo/tools), so this one mount
      # persists everything across rebuilds — the dependency volume this file
      # used to declare is gone: a tool now travels with the library, not with
      # the image.
      #
      # This IS the Soulseek share as well: slskd - the Soulseek client this
      # app runs - is configured with /music as its shared folder, so whatever
      # this mount points at is what other users search and browse. Point it at
      # the library, nothing narrower (a mount holding only part of the library
      # shares only that part) and never at the download folder.
      #
      # EDIT THIS LINE. The committed value is the repo-relative ./music (the
      # folder this template ships beside), which is a placeholder, not a
      # library: compose CREATES an empty ./music on the host if it is missing,
      # and an app pointed at an empty folder shows an empty library. Absolute
      # host paths are what a real install uses:
      #   - /path/to/your/music:/music      # Linux/macOS
      #   - D:/Music:/music                 # Windows (Docker Desktop)
      - ./music:/music
    restart: unless-stopped
    # How long Docker waits after SIGTERM before it SIGKILLs the container.
    # This is the number that decides whether a script mid-album, an import
    # mid-move or a tag write gets to finish or to abort cleanly.
    #
    # 3 minutes, and the arithmetic is deliberate:
    #   * the app's own shutdown wait is 120 s
    #     (server/interrupt_recovery.GRACE_SECONDS): it stops taking new work,
    #     waits that long for the jobs that are running while logging what it
    #     is waiting for, then records whatever it could not finish in
    #     .mlo/data/interrupted_jobs.json for the next start to reconcile;
    #   * 180 s leaves 60 s of headroom above that for the journal write and
    #     for uvicorn to close the server down, so this ordered abort ALWAYS
    #     completes before Docker's SIGKILL — including on the update path,
    #     where watchtower passes its own timeout (see WATCHTOWER_TIMEOUT).
    #
    # It is deliberately not longer: an update should not hang for a quarter of
    # an hour behind a long "Format All" run, and nothing is lost by cutting
    # one short — every write is atomic (mlo/atomic.py: temp file, fsync, ONE
    # os.replace), so a killed run leaves the old file or the new one, and the
    # next start sweeps its temp files and reports the interrupted job.
    #
    # "Every" is now literal. rsgain used to be the exception: `rsgain easy`
    # rewrites a track's tags IN PLACE, and a SIGKILL inside that can tear the
    # file past repair. Script 7 measures ReplayGain with a scan (`custom -s s`,
    # the same measurement in the same time) and stores the tags itself, so no
    # external tool is ever handed a library file to write.
    stop_grace_period: 3m
    # Opt in to watchtower's automatic updates (WATCHTOWER_LABEL_ENABLE=true).
    labels:
      - com.centurylinklabs.watchtower.enable=true
    # Mirrors the image's HEALTHCHECK so `docker compose ps` and watchtower
    # see readiness. The container runs as uid 1000; if your library is owned
    # by someone else, rebuild the image with matching build args or chown the
    # host folder to 1000 - otherwise the app cannot write /music/.mlo, and
    # slskd cannot READ the library it is supposed to share (an unreadable
    # subfolder is skipped silently, so the share just comes up short).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

# ---------------------------------------------------------------------------
# Automatic updates (on by default - see the note at the top of this file).
#
# watchtower polls the registry and, when a newer la musica image appears,
# stops this container, pulls the new one and starts it again. Two deliberate
# restrictions: WATCHTOWER_LABEL_ENABLE means it only ever touches containers
# carrying the watchtower label (the app above is the only one), and CLEANUP
# removes the image it replaced rather than leaving every version on disk.
#
# It checks every WATCHTOWER_POLL_INTERVAL (300 s by default) — the first check
# is one interval after it starts, not at startup, so waiting out the first
# tick is expected. To run a check NOW (a release you do not want to wait for):
#
#   docker compose run --rm watchtower --run-once
#
# which uses this service's own socket, label filter and cleanup flags.
#
# It needs the Docker socket. That is a privileged mount — it is how any
# updater works — and on Docker Desktop it is the same path as on Linux.
#
# A restart interrupts playback for a few seconds; clients reconnect on their
# own (the shell retries, the player resumes from where it was).
# ---------------------------------------------------------------------------
  watchtower:
    # The maintained continuation of the archived containrrr image. The
    # archived one negotiates Docker API 1.25 and a modern daemon refuses
    # anything below 1.40 ("client version 1.25 is too old"), after which it
    # panics on its own error path — verified here against Docker 29. This one
    # speaks the current API with no workaround.
    image: nickfedor/watchtower:latest
    container_name: la-musica-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only containers that carry the label above — never anything else you
      # run on this host.
      - WATCHTOWER_LABEL_ENABLE=true
      # Delete the image this one replaced, so updates do not accumulate.
      - WATCHTOWER_CLEANUP=true
      # Every 5 minutes, not nightly: the check is one manifest request against
      # the registry, and an unchanged digest ends it there, so the image is
      # pulled only when there is something new. Lower it for a faster pickup
      # (`WATCHTOWER_POLL_INTERVAL=60`), raise it on a metered link.
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      # How long watchtower waits after SIGTERM before it force-kills the
      # container it is replacing (its --stop-timeout; default 30s, which is
      # far too short here: a 30-second window would SIGKILL the app in the
      # middle of an album). It must be at least the app's own shutdown wait
      # and it is set to the SAME number as the service's stop_grace_period
      # above, so the update path and `docker compose stop` behave identically:
      # the app stops taking new work, gets up to 120 s to finish or abort what
      # is running (logging what it waits for), records the rest, and only then
      # does Docker SIGKILL.
      - WATCHTOWER_TIMEOUT=${WATCHTOWER_TIMEOUT:-3m}
      # A cron WINDOW instead of polling all day is the alternative — but
      # watchtower refuses to start when both are set, so uncomment this AND
      # comment the interval above, never both:
      #   - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
      # Timestamps in the updater's log follow the host's clock.
      - TZ=${TZ:-Etc/UTC}
