# la musica - Docker Compose template.
#
# Music folder: MLO_MUSIC_FOLDER is the folder INSIDE the container holding your
# library, and it must be the target of the bind mount below. Point the host
# side (./music) at your real library:
#
#   volumes:
#     - /path/to/your/music:/music      # Linux/macOS
#     - D:/Music:/music                 # Windows (Docker Desktop)
#
# Everything the app writes lives under /music/.mlo (data/, downloads/, trash/)
# except runtime-fetched tools, which go to the /app/.dependencies volume.
#
# Commands:
#   docker compose up -d --build     # build from source and start
#   docker compose logs -f           # follow the backend log
#   docker compose pull              # fetch the prebuilt GHCR image
#   docker compose up -d             # (re)start on that image
#   docker compose down              # stop and remove
#
# Automatic updates are ON by default: the watchtower service at the bottom
# checks the registry every 5 minutes and restarts this container when a new
# image appears, so a `docker compose pull` is something you never have to
# remember. (It was a nightly 04:00 cron; a release now lands while you are
# still reading its notes.)
#
# Two things worth knowing before it does that:
#   * it keeps every OTHER container on the host alone (the label on this
#     service plus WATCHTOWER_LABEL_ENABLE);
#   * it updates the IMAGE, so if you started with `--build` (a local build
#     tagged with the same name) the first check replaces your build with the
#     published one. To keep building from source, start just the app -
#     `docker compose up -d lamusica` - or comment the service out.
#
# How often it checks: WATCHTOWER_POLL_INTERVAL (seconds, default 300; 60 is
# the aggressive end and still just one manifest request per minute). To check
# inside a window instead, use the WATCHTOWER_SCHEDULE line in the service
# below - and comment the interval out, because watchtower REFUSES TO START
# when both are set ("Cannot define both interval and schedule").
#   WATCHTOWER_POLL_INTERVAL=60 docker compose up -d watchtower

# The compose project name is PINNED. It is derived from the FOLDER name
# otherwise, and this repo's folder has already been renamed once (la-musica ->
# MusicLibraryOptimizer): that silently started a second project whose
# `musiclibraryoptimizer_lamusica-dependencies` volume was empty, while the real
# installs (beets, librosa, yt-dlp, simple-dr-meter) sat in
# `la-musica_lamusica-dependencies`. With the name pinned, the volumes and the
# network follow the app, not the directory you happen to run compose from.
name: la-musica

services:
  lamusica:
    build: .
    image: ghcr.io/dillydalli3r/la-musica:latest
    container_name: la-musica
    ports:
      - "8000:8000"
    environment:
      # Folder inside the container to treat as the music library.
      - MLO_MUSIC_FOLDER=/music
      # The address the server binds — and therefore whether the login gate
      # applies: a non-loopback bind turns it ON (server/auth.py). The image
      # sets this already; it is repeated here because this is the line that
      # decides whether the published port is protected. First visit asks for
      # a password (POST /api/auth/setup); every client signs in with it.
      - MLO_SERVER_HOST=0.0.0.0
    volumes:
      # ALL app state (config.json, playlists.db + wishes.db, slskd.yaml,
      # the beets config + beets-library.db, and the ReplayGain / RYM /
      # metadata caches) lives in /music/.mlo/data, beside the transient
      # /music/.mlo/downloads and /music/.mlo/trash, so this one mount
      # persists everything across rebuilds.
      - "F:/media/music:/music"
      # Runtime-installed tools (Settings -> Dependencies: beets, librosa, ...).
      - lamusica-dependencies:/app/.dependencies
    restart: unless-stopped
    # Opt in to watchtower's automatic updates (WATCHTOWER_LABEL_ENABLE=true).
    labels:
      - com.centurylinklabs.watchtower.enable=true
    # Mirrors the image's HEALTHCHECK so `docker compose ps` and watchtower
    # see readiness. The container runs as uid 1000; if your library is owned
    # by someone else, rebuild the image with matching build args or chown the
    # host folder to 1000 - otherwise the app cannot write /music/.mlo.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

# ---------------------------------------------------------------------------
# Automatic updates (on by default - see the note at the top of this file).
#
# watchtower polls the registry and, when a newer la musica image appears,
# stops this container, pulls the new one and starts it again. Two deliberate
# restrictions: WATCHTOWER_LABEL_ENABLE means it only ever touches containers
# carrying the watchtower label (the app above is the only one), and CLEANUP
# removes the image it replaced rather than leaving every version on disk.
#
# It checks every WATCHTOWER_POLL_INTERVAL (300 s by default) — the first check
# is one interval after it starts, not at startup, so waiting out the first
# tick is expected. To run a check NOW (a release you do not want to wait for):
#
#   docker compose run --rm watchtower --run-once
#
# which uses this service's own socket, label filter and cleanup flags.
#
# It needs the Docker socket. That is a privileged mount — it is how any
# updater works — and on Docker Desktop it is the same path as on Linux.
#
# A restart interrupts playback for a few seconds; clients reconnect on their
# own (the shell retries, the player resumes from where it was).
# ---------------------------------------------------------------------------
  watchtower:
    # The maintained continuation of the archived containrrr image. The
    # archived one negotiates Docker API 1.25 and a modern daemon refuses
    # anything below 1.40 ("client version 1.25 is too old"), after which it
    # panics on its own error path — verified here against Docker 29. This one
    # speaks the current API with no workaround.
    image: nickfedor/watchtower:latest
    container_name: la-musica-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only containers that carry the label above — never anything else you
      # run on this host.
      - WATCHTOWER_LABEL_ENABLE=true
      # Delete the image this one replaced, so updates do not accumulate.
      - WATCHTOWER_CLEANUP=true
      # Every 5 minutes, not nightly: the check is one manifest request against
      # the registry, and an unchanged digest ends it there, so the image is
      # pulled only when there is something new. Lower it for a faster pickup
      # (`WATCHTOWER_POLL_INTERVAL=60`), raise it on a metered link.
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      # A cron WINDOW instead of polling all day is the alternative — but
      # watchtower refuses to start when both are set, so uncomment this AND
      # comment the interval above, never both:
      #   - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
      # Timestamps in the updater's log follow the host's clock.
      - TZ=${TZ:-Etc/UTC}

volumes:
  lamusica-dependencies:
