[package]
name = "mlo-desktop"
version = "3.6.0"
description = "la musica desktop shell (Tauri v2)"
authors = ["dillydalli3r"]
edition = "2021"

[lib]
name = "mlo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# Native OS notifications for "wish found" / "download done" / "import ready".
# The only plugin that ships on all five targets, so it is registered outside
# the desktop-only block in lib.rs.
tauri-plugin-notification = "2"
# A parking_lot Mutex for the tray checkbox state (see lib.rs).
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
