[package]
name = "mlo-desktop"
version = "3.1.6"
description = "la musica desktop shell (Tauri v2)"
authors = ["dillydalli3r"]
edition = "2021"

[lib]
name = "mlo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# Native OS notifications for "wish found" / "download done" / "import ready".
# The only plugin that ships on all five targets, so it is registered outside
# the desktop-only block in lib.rs.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A parking_lot Mutex for the mobile backend's state: it is locked on every
# `backend_info` call and never needs the poisoning dance.
parking_lot = "0.12"

# Android only: the bundled Python tree ships as one gzipped tar inside the APK's
# native-lib directory (APK assets have no filesystem path, and CPython needs a
# real path to import from), so the shell unpacks it into the app's own storage
# on first launch. iOS reads its runtime straight out of the bundle as files and
# needs neither crate.
[target.'cfg(target_os = "android")'.dependencies]
flate2 = "1"
tar = "0.4"

# iOS only: the keep-alive. When music is playing the app is kept alive by its
# audio session (that is what UIBackgroundModes: audio declares in Info.plist),
# and the user can additionally ask the shell to hold a silent session so the
# backend keeps serving with nothing playing — see `keepalive` in
# mobile_backend.rs for what that is and is not.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3", features = ["AVAudioSession", "AVAudioSessionTypes"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
