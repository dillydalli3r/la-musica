name: Desktop bundles

# Builds the Tauri shell as a real bundle on Windows, macOS and Linux and
# uploads whatever each bundler produced. Reusable (`release.yml` calls it) and
# manually dispatchable; it is deliberately not wired to every push, because
# three OS runners plus a full Rust release build is minutes of CI for bundles
# nobody asked for.
#
# Why the bundles are listed per platform instead of `--bundles all`: `all`
# includes the RPM target, and rpmbuild only exists on the runner if the `rpm`
# package is installed (tauri-action installs it, this workflow does not use
# the action). msi/nsis, app/dmg and deb/AppImage are what the three platforms
# actually install from.
#
# Neither the Rust toolchain nor the Tauri CLI is installed here: the runner
# images ship a stable rustup toolchain, and the CLI comes from
# desktop/package-lock.json (`npm ci`), so the bundle is built by exactly the
# version this repository pins. The frontend is not built here either: each leg
# wraps the web/dist ci.yml built and uploaded for this commit, with tauri's
# beforeBuildCommand cleared so it cannot build it a second time.

on:
  workflow_dispatch:
  workflow_call:

# One run per ref: a workflow_dispatch fired while a tag's release is building
# the same bundles waits for nothing and cancels nothing useful, but a second
# push to the same branch supersedes its predecessor instead of queueing three
# more OS runners behind it.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri's Linux system dependencies
        # Same list as ci.yml: webkit2gtk/gtk/soup are what tauri's build
        # script and its glib-sys, gdk-sys, … bindings link against, and
        # patchelf is what the AppImage bundler rewrites ELF headers with.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Use the frontend ci.yml built
        # The one build of web/dist for this commit. A dispatch of this file on
        # its own has no CI run behind it, which is what the guarded build below
        # is for.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-dist
          path: web/dist

      - name: npm ci (desktop)
        # tauri-cli: the icon generator, the bundlers and `tauri build` itself.
        working-directory: desktop
        run: npm ci

      - name: Build the frontend when this run carried none
        # The built index.html is the test, so a download that half-failed lands
        # here too rather than handing tauri a stale tree.
        if: hashFiles('web/dist/index.html') == ''
        working-directory: web
        run: npm ci && npm run build

      - name: Cache the Rust crate graph
        # The Rust build is the expensive part of this job and it is almost
        # entirely dependencies: with the crate graph cached, a bundle build
        # drops from ~10 minutes to ~2, and only the shell crate itself is
        # recompiled. Keyed per platform — the compiled artifacts are not
        # portable between them.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.os }}

      - name: Build the frozen local backend (PyInstaller)
        # The desktop install bundles the app's own backend (`mlo-server`), a
        # frozen Python service built per-OS from pyinstaller/mlo-server.spec.
        # The spec packs web/dist (which this run already has) at
        # _internal/web/dist; stage_desktop_bundle.py then copies the whole
        # tree into desktop/bundle for tauri, together with the native
        # `mlo-audio` helper (rust/, zero crate deps, so it builds in seconds
        # and needs no crates.io). The toolchain comes from
        # server/requirements.txt, installed into the runner's python.
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          python -m pip install -r server/requirements.txt
          python -m pip install pyinstaller
          python -m PyInstaller pyinstaller/mlo-server.spec
          python tools/stage_desktop_bundle.py

      - name: Build the bundles
        working-directory: desktop
        # Two things are merged in here, both of them only true of this build:
        # `beforeBuildCommand` (`npm run build --prefix ../web ...`) would
        # rebuild the frontend this leg just downloaded — and needs
        # web/node_modules back to do it — so the hook is cleared; and
        # `bundle.resources` maps the tree the step above staged to
        # `<resource_dir>/mlo-server`, which is where the shell spawns it.
        # The resource lives here (and in desktop/package.json's `build`, via
        # src-tauri/tauri.bundle.conf.json) rather than in a config file
        # because `tauri-build` validates resource paths on EVERY compile: in a
        # config, a plain `cargo check` in a checkout that never staged a
        # 300 MB backend would fail with "resource path ... doesn't exist".
        # shell: bash, because the Windows runner's PowerShell cannot be
        # trusted to pass that JSON argument through intact.
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }} --config '{"build":{"beforeBuildCommand":null},"bundle":{"resources":{"../bundle/mlo-server":"mlo-server"}}}'

      - name: Verify the icons inside the built bundles
        # `bundle.icon` is what each bundler is *told* to use; what it actually
        # embedded is a different question with a real answer, and that answer
        # was wrong: the NSIS installer drew Tauri's own default installer icon
        # because `bundle.windows.nsis` named none, which no amount of checking
        # the committed files could reveal. So each platform's bundle is opened
        # here. `tools/test_icons.py` proves the repo's icon files are the
        # artwork; this step proves the installers carry them.
        shell: bash
        run: |
          set -e
          # `python3` is not on the Windows runner's PATH, `python` is not on
          # the macOS/Linux ones, so the interpreter is resolved rather than
          # assumed. GitHub runs this script with `-e -o pipefail`, and `find`
          # on a bundle directory this platform did not produce exits non-zero
          # — so every lookup is guarded by an existence test instead of a
          # redirect, which pipefail would otherwise turn into a failed step.
          PY="$(command -v python3 || command -v python)"
          B=desktop/src-tauri/target/release/bundle
          # `find` recurses, so the app exe's lookup is bounded to depth 1 —
          # otherwise it matches the NSIS installer under bundle/nsis and the
          # app exe itself is never looked at.
          first() { if [ -d "$1" ]; then find "$1" -maxdepth "${3:-9}" -name "$2" 2>/dev/null | head -1; fi; }

          APP="$(first "$B" '*.app')"
          if [ -n "$APP" ]; then
            test -f "$APP/Contents/Resources/icon.icns" \
              || { echo "::error::$APP carries no Contents/Resources/icon.icns"; exit 1; }
            cmp "$APP/Contents/Resources/icon.icns" desktop/src-tauri/icons/icon.icns \
              || { echo "::error::the .app's icon.icns is not the committed artwork"; exit 1; }
            echo "ok: $APP carries the committed icon.icns"
          fi

          EXE="$(first desktop/src-tauri/target/release '*.exe' 1)"
          if [ -n "$EXE" ]; then "$PY" tools/bundle_icons.py --exe "$EXE"; fi

          NSIS="$(first "$B/nsis" '*.exe')"
          if [ -n "$NSIS" ]; then "$PY" tools/bundle_icons.py --exe "$NSIS"; fi

          DEB="$(first "$B/deb" '*.deb')"
          if [ -n "$DEB" ]; then
            rm -rf /tmp/debicons && mkdir -p /tmp/debicons
            dpkg-deb -x "$DEB" /tmp/debicons
            # The icons the package INSTALLS, not every PNG inside it: the
            # bundled backend brings the SPA's own images, and the deb places
            # the whole app under `/usr/lib/la musica/` — a path with a space,
            # which this word-splitting loop cannot survive, and not a desktop
            # icon to art-check anyway.
            found=0
            for icon in $(find /tmp/debicons/usr/share/icons /tmp/debicons/usr/share/pixmaps \
                          -name '*.png' 2>/dev/null); do
              found=1
              "$PY" tools/bundle_icons.py --png "$icon"
            done
            [ "$found" = 1 ] || { echo "::error::$DEB installs no icon files"; exit 1; }
          fi

          # Each install must CARRY the backend the shell spawns. Nothing in
          # the source tree shows this: the shell looks for
          # <resource_dir>/mlo-server at runtime, and a bundle that ships
          # without it opens the setup wizard with no server behind it — the
          # exact shape the first 5.1.0 installers had (a 4 MB MSI holding a
          # 300 MB backend's address). So it is looked for in the artifact.
          if [ -n "$APP" ]; then
            test -f "$APP/Contents/Resources/mlo-server/mlo-server" \
              || { echo "::error::$APP carries no Resources/mlo-server/mlo-server"; exit 1; }
            test -f "$APP/Contents/Resources/mlo-server/_internal/web/dist/index.html" \
              || { echo "::error::$APP's backend carries no web/dist (the UI would 404)"; exit 1; }
            echo "ok: $APP carries the backend and its SPA"
          fi

          if [ -n "$DEB" ]; then
            # Located by name, not by path: the deb's resource directory is
            # Tauri's business, what matters is that the payload is in the
            # package at all.
            find /tmp/debicons -type f -name mlo-server | grep -q . \
              || { echo "::error::$DEB installs no mlo-server"; exit 1; }
            find /tmp/debicons -type f -path '*web/dist/index.html' | grep -q . \
              || { echo "::error::$DEB's backend carries no web/dist"; exit 1; }
            echo "ok: $DEB carries the backend and its SPA"
          fi

          SEVENZ="$(command -v 7z || command -v 7za || true)"
          if [ -n "$NSIS" ] && [ -n "$SEVENZ" ]; then
            "$SEVENZ" l "$NSIS" 2>/dev/null | grep -qE 'mlo-server[\\/]mlo-server\.exe' \
              || { echo "::error::$NSIS carries no mlo-server"; exit 1; }
            "$SEVENZ" l "$NSIS" 2>/dev/null | grep -qE 'mlo-server[\\/]_internal[\\/]web[\\/]dist[\\/]index\.html' \
              || { echo "::error::$NSIS's backend carries no web/dist"; exit 1; }
            echo "ok: $NSIS carries the backend and its SPA"
          fi

      - name: Run the backend each install carries
        # The step above proves the payload is IN the install; this proves it
        # RUNS, which is the half a file listing cannot see. A frozen
        # PyInstaller build has NO console, so `sys.stdout` and `sys.stderr`
        # are None and uvicorn's logging config raises while formatting the
        # formatter it was given — that killed the backend of the first 5.1.0
        # installers before it ever bound a port, and installers carrying a
        # dead backend passed every check there was. So the backend is started
        # the way the shell starts it (loopback, a scratch data dir) and asked
        # for /api/health and for the SPA it is supposed to serve.
        #
        # Linux and macOS only. The Windows install is exercised by hand on the
        # machine these binaries are built on (the NSIS payload extracted,
        # launched with no console, /api/health 200), and a native `.exe` under
        # git-bash wants its paths translated first — a check of the harness
        # more than of the install.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          B=desktop/src-tauri/target/release/bundle
          # `set -e` with `pipefail` turns a `find` over a bundle directory this
          # platform did not produce into a failed step (the icon step above
          # learned this the hard way), so every lookup is guarded by an
          # existence test rather than by a redirect.
          first() { if [ -d "$1" ]; then find "$1" -maxdepth "${3:-9}" -name "$2" 2>/dev/null | head -1; fi; }
          run_backend() {
            bin="$1"; port="$2"
            dir="$(mktemp -d)"
            MLO_SERVER_HOST=127.0.0.1 MLO_SERVER_PORT="$port" MLO_APP_DATA_DIR="$dir" \
              "$bin" >"$dir/server.out" 2>&1 &
            pid=$!
            ok=0; tries=0
            while [ "$tries" -lt 60 ]; do
              tries=$((tries + 1)); sleep 1
              curl -sf "http://127.0.0.1:$port/api/health" >/dev/null 2>&1 && { ok=1; break; }
              kill -0 "$pid" 2>/dev/null || break
            done
            if [ "$ok" = 1 ]; then
              curl -sf "http://127.0.0.1:$port/" | grep -qi '<!doctype html' \
                || { echo "::error::$bin answers /api/health but serves no SPA (the UI would 404)"; kill "$pid" 2>/dev/null || true; exit 1; }
              echo "ok: $bin runs - $(curl -s "http://127.0.0.1:$port/api/health" | head -c 56)"
            else
              echo "::error::$bin did not answer on 127.0.0.1:$port"
              tail -30 "$dir/server.out" || true
              exit 1
            fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          APP="$(first "$B" '*.app' 2)"
          if [ -n "$APP" ]; then
            run_backend "$APP/Contents/Resources/mlo-server/mlo-server" 8123
          fi

          DEB="$(first "$B/deb" '*.deb' 1)"
          if [ -n "$DEB" ]; then
            rm -rf /tmp/debrun && mkdir -p /tmp/debrun
            dpkg-deb -x "$DEB" /tmp/debrun
            run_backend "$(find /tmp/debrun -type f -name mlo-server | head -1)" 8124
          fi

          APPIMAGE="$(first "$B/appimage" '*.AppImage' 1)"
          if [ -n "$APPIMAGE" ]; then
            rm -rf /tmp/appimg && mkdir -p /tmp/appimg
            abs="$(cd "$(dirname "$APPIMAGE")" && pwd)/$(basename "$APPIMAGE")"
            ( cd /tmp/appimg && "$abs" --appimage-extract >/dev/null )
            run_backend "$(find /tmp/appimg -type f -name mlo-server | head -1)" 8125
          fi

      - name: The installed Linux app asks, then starts its own backend
        # Two things only the real app can prove, and both are about the first
        # run:
        #
        #   1. a shell that has never been asked does NOT start a backend by
        #      itself — it shows the question (built-in backend, or a server
        #      you run) and waits. Launching a server nobody asked for is the
        #      behaviour this screen exists to replace;
        #   2. having been told "built-in", it FINDS that backend and serves
        #      through it. `<resource_dir>/mlo-server` is where the shell
        #      looks, and on Linux resource_dir() is derived rather than
        #      stored — `${exe_dir}/../lib/<name>` for a deb,
        #      `${APPDIR}/usr/lib/<name>` for an AppImage, both with a SPACE in
        #      the product name — so nothing short of running the shell proves
        #      the resolution.
        #
        # The answer is written where the shell records it (`shell.json`, in
        # the per-user data dir the launcher passes on as MLO_APP_DATA_DIR);
        # clicking the screen itself is the web team's check, driven in a
        # browser against the same build.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          B=desktop/src-tauri/target/release/bundle
          first() { if [ -d "$1" ]; then find "$1" -maxdepth "${3:-9}" -name "$2" 2>/dev/null | head -1; fi; }
          DEB="$(first "$B/deb" '*.deb' 1)"
          APPIMAGE="$(first "$B/appimage" '*.AppImage' 1)"
          [ -n "$DEB" ] || { echo "::error::no deb to launch"; exit 1; }

          sudo apt-get install -y xvfb dbus >/dev/null
          export XDG_RUNTIME_DIR=/tmp/xdgrun; mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          # A runner has no GPU; WebKitGTK needs to be told, or it exits
          # before the shell's setup ever runs.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1
          # The shell's own profile: fresh for phase 1, answered for phase 2.
          APP_DATA="$HOME/.local/share/la musica"

          # The ports a shell this build owns would answer on (8011 up, the
          # range `backend::FIRST_PORT` scans). Always exits 0 — "nothing
          # answers" is a normal answer here, and `set -e` would otherwise
          # abort on the caller's assignment.
          health_port() {
            for p in $(seq 8011 8020); do
              curl -sf "http://127.0.0.1:$p/api/health" >/dev/null 2>&1 && { echo "$p"; return 0; }
            done
            return 0
          }

          # Launch the app the way a desktop session does: its own process
          # group under Xvfb, on a session bus (the shell's tray and its
          # single-instance lock both register there; a missing bus is a panic
          # in the runner, not a fact about the install). Sets $pid; call
          # `stop_app` when done.
          start_app() {
            setsid dbus-run-session -- xvfb-run -a "$1" >/tmp/app.out 2>&1 &
            pid=$!
          }
          stop_app() {
            # One kill takes the app, its Xvfb and its backend child: they are
            # this session's process group (setsid).
            kill -TERM -- "-$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          rm -rf /tmp/debrun && mkdir -p /tmp/debrun
          dpkg-deb -x "$DEB" /tmp/debrun
          APP_BIN="$(find /tmp/debrun/usr/bin -maxdepth 1 -type f | head -1)"

          # Phase 1 — never asked: no backend, and the app stays up (it is
          # showing the question, not crashing).
          rm -rf "$APP_DATA"
          start_app "$APP_BIN"
          sleep 25
          asked_port="$(health_port)"
          if [ -n "$asked_port" ]; then
            echo "::error::$APP_BIN started a backend on $asked_port before it was asked to"
            stop_app
            exit 1
          fi
          kill -0 "$pid" 2>/dev/null || {
            echo "::error::$APP_BIN exited instead of showing the first-run question"
            tail -30 /tmp/app.out || true
            exit 1
          }
          echo "ok: $APP_BIN started nothing until it was asked"
          stop_app

          # Phase 2 — answered "built-in": the bundled backend comes up.
          mkdir -p "$APP_DATA"
          printf '{"backend_mode":"local","music_folder":""}' > "$APP_DATA/shell.json"
          start_app "$APP_BIN"
          port=""; tries=0
          while [ "$tries" -lt 90 ]; do
            tries=$((tries + 1)); sleep 1
            port="$(health_port)"
            [ -n "$port" ] && break
            kill -0 "$pid" 2>/dev/null || break
          done
          stop_app
          [ -n "$port" ] || {
            echo "::error::$APP_BIN came up with no backend of its own"
            tail -30 /tmp/app.out || true
            exit 1
          }
          echo "ok: $APP_BIN started its own backend on 127.0.0.1:$port once it was told to"

          if [ -n "$APPIMAGE" ]; then
            rm -rf /tmp/appimg && mkdir -p /tmp/appimg
            abs="$(cd "$(dirname "$APPIMAGE")" && pwd)/$(basename "$APPIMAGE")"
            ( cd /tmp/appimg && "$abs" --appimage-extract >/dev/null )
            start_app "$(find /tmp/appimg/usr/bin -maxdepth 1 -type f | head -1)"
            port=""; tries=0
            while [ "$tries" -lt 90 ]; do
              tries=$((tries + 1)); sleep 1
              port="$(health_port)"
              [ -n "$port" ] && break
              kill -0 "$pid" 2>/dev/null || break
            done
            stop_app
            [ -n "$port" ] || {
              echo "::error::the AppImage came up with no backend of its own"
              tail -30 /tmp/app.out || true
              exit 1
            }
            echo "ok: the AppImage started its own backend on 127.0.0.1:$port"
          fi

      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          name: la-musica-${{ runner.os }}
          # Only one of these globs matches per runner; `if-no-files-found`
          # still fails the job when a platform produced nothing at all.
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
