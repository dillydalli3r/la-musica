name: Desktop bundles

# Builds the Tauri shell as a real bundle on Windows, macOS and Linux and
# uploads whatever each bundler produced. Reusable (`release.yml` calls it) and
# manually dispatchable; it is deliberately not wired to every push, because
# three OS runners plus a full Rust release build is minutes of CI for bundles
# nobody asked for.
#
# Why the bundles are listed per platform instead of `--bundles all`: `all`
# includes the RPM target, and rpmbuild only exists on the runner if the `rpm`
# package is installed (tauri-action installs it, this workflow does not use
# the action). msi/nsis, app/dmg and deb/AppImage are what the three platforms
# actually install from.
#
# Neither the Rust toolchain nor the Tauri CLI is installed here: the runner
# images ship a stable rustup toolchain, and the CLI comes from
# desktop/package-lock.json (`npm ci`), so the bundle is built by exactly the
# version this repository pins. The frontend is not built here either: each leg
# wraps the web/dist ci.yml built and uploaded for this commit, with tauri's
# beforeBuildCommand cleared so it cannot build it a second time.

on:
  workflow_dispatch:
  workflow_call:

# One run per ref: a workflow_dispatch fired while a tag's release is building
# the same bundles waits for nothing and cancels nothing useful, but a second
# push to the same branch supersedes its predecessor instead of queueing three
# more OS runners behind it.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri's Linux system dependencies
        # Same list as ci.yml: webkit2gtk/gtk/soup are what tauri's build
        # script and its glib-sys, gdk-sys, … bindings link against, and
        # patchelf is what the AppImage bundler rewrites ELF headers with.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Use the frontend ci.yml built
        # The one build of web/dist for this commit. A dispatch of this file on
        # its own has no CI run behind it, which is what the guarded build below
        # is for.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-dist
          path: web/dist

      - name: npm ci (desktop)
        # tauri-cli: the icon generator, the bundlers and `tauri build` itself.
        working-directory: desktop
        run: npm ci

      - name: Build the frontend when this run carried none
        # The built index.html is the test, so a download that half-failed lands
        # here too rather than handing tauri a stale tree.
        if: hashFiles('web/dist/index.html') == ''
        working-directory: web
        run: npm ci && npm run build

      - name: Cache the Rust crate graph
        # The Rust build is the expensive part of this job and it is almost
        # entirely dependencies: with the crate graph cached, a bundle build
        # drops from ~10 minutes to ~2, and only the shell crate itself is
        # recompiled. Keyed per platform — the compiled artifacts are not
        # portable between them.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.os }}

      - name: Build the bundles
        working-directory: desktop
        # beforeBuildCommand (`npm run build --prefix ../web`) would rebuild the
        # frontend this leg just downloaded — and needs web/node_modules back to
        # do it — so the hook is cleared from the merged config. shell: bash,
        # because the Windows runner's PowerShell cannot be trusted to pass that
        # JSON argument through intact.
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }} --config '{"build":{"beforeBuildCommand":null}}'

      - name: Verify the icons inside the built bundles
        # `bundle.icon` is what each bundler is *told* to use; what it actually
        # embedded is a different question with a real answer, and that answer
        # was wrong: the NSIS installer drew Tauri's own default installer icon
        # because `bundle.windows.nsis` named none, which no amount of checking
        # the committed files could reveal. So each platform's bundle is opened
        # here. `tools/test_icons.py` proves the repo's icon files are the
        # artwork; this step proves the installers carry them.
        shell: bash
        run: |
          set -e
          # `python3` is not on the Windows runner's PATH, `python` is not on
          # the macOS/Linux ones, so the interpreter is resolved rather than
          # assumed. GitHub runs this script with `-e -o pipefail`, and `find`
          # on a bundle directory this platform did not produce exits non-zero
          # — so every lookup is guarded by an existence test instead of a
          # redirect, which pipefail would otherwise turn into a failed step.
          PY="$(command -v python3 || command -v python)"
          B=desktop/src-tauri/target/release/bundle
          # `find` recurses, so the app exe's lookup is bounded to depth 1 —
          # otherwise it matches the NSIS installer under bundle/nsis and the
          # app exe itself is never looked at.
          first() { if [ -d "$1" ]; then find "$1" -maxdepth "${3:-9}" -name "$2" 2>/dev/null | head -1; fi; }

          APP="$(first "$B" '*.app')"
          if [ -n "$APP" ]; then
            test -f "$APP/Contents/Resources/icon.icns" \
              || { echo "::error::$APP carries no Contents/Resources/icon.icns"; exit 1; }
            cmp "$APP/Contents/Resources/icon.icns" desktop/src-tauri/icons/icon.icns \
              || { echo "::error::the .app's icon.icns is not the committed artwork"; exit 1; }
            echo "ok: $APP carries the committed icon.icns"
          fi

          EXE="$(first desktop/src-tauri/target/release '*.exe' 1)"
          if [ -n "$EXE" ]; then "$PY" tools/bundle_icons.py --exe "$EXE"; fi

          NSIS="$(first "$B/nsis" '*.exe')"
          if [ -n "$NSIS" ]; then "$PY" tools/bundle_icons.py --exe "$NSIS"; fi

          DEB="$(first "$B/deb" '*.deb')"
          if [ -n "$DEB" ]; then
            rm -rf /tmp/debicons && mkdir -p /tmp/debicons
            dpkg-deb -x "$DEB" /tmp/debicons
            found=0
            for icon in $(find /tmp/debicons -name '*.png' -path '*icons*'); do
              found=1
              "$PY" tools/bundle_icons.py --png "$icon"
            done
            [ "$found" = 1 ] || { echo "::error::$DEB installs no icon files"; exit 1; }
          fi

      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          name: la-musica-${{ runner.os }}
          # Only one of these globs matches per runner; `if-no-files-found`
          # still fails the job when a platform produced nothing at all.
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
