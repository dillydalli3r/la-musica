name: Release

# Creating a v* tag runs CI first and only then builds the web frontend,
# publishes a GitHub release carrying the packaged source zip
# (la-musica-<version>-windows-x64.zip: mlo/, server/, tools/, web/dist,
# start_app.py, tray.py) plus the desktop bundles (Windows/macOS/Linux) and
# the mobile builds (an unsigned Android APK and an unsigned iOS IPA — see
# .github/workflows/mobile.yml for why they cannot be signed here), and pushes
# a Docker image to GHCR. The tag is checked against mlo/__init__.py first: the
# app reports that version, so a mistagged release would ship two different
# answers to "which version is this?".
# There is no in-app updater (desktop/src-tauri/tauri.conf.json configures no
# updater plugin/endpoints/pubkey), so a release is consumed by downloading an
# installer/zip, sideloading the mobile build, or pulling the image; the
# draft/prerelease flags below are just the default "this is a real release"
# choice.

on:
  push:
    tags:
      - "v*"
  # Re-running a release without re-tagging (a tag whose build failed on one
  # platform, a GHCR push that hit a registry hiccup). The version check below
  # still binds the run to the tag it is on, so this cannot publish a release
  # for a version the source does not claim.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ci.yml is reusable (workflow_call), so the release can depend on the whole
  # suite: a tag that does not pass CI publishes nothing.
  ci:
    uses: ./.github/workflows/ci.yml

  # The client bundles, built from the same reusable workflows the manual runs
  # use. A tag should still publish the app (source zip + Docker image) when a
  # platform's own toolchain is having a bad day: the failing job is red in the
  # run either way, and `if: always()` below is what lets the release job run
  # after it instead of being skipped. (Note: `continue-on-error` is NOT usable
  # on a job that calls a reusable workflow — the workflow file fails to load,
  # which is how this shipped once and published nothing.)
  desktop:
    needs: ci
    uses: ./.github/workflows/desktop.yml

  mobile:
    needs: ci
    uses: ./.github/workflows/mobile.yml

  release:
    # Every platform, or nothing. An earlier version of this ran the release
    # even after a client build failed (`if: always()`), on the theory that the
    # source zip and the Docker image are still worth publishing — but the run
    # that proved it also showed the trap: the release then goes out with a
    # platform missing from its assets and nobody notices, because the OLD
    # installer is still sitting there under the same name. A tag that cannot
    # build all five platforms must fail loudly instead.
    needs: [ci, desktop, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci + build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the app's own version
        # The shipped app reports mlo.__version__ on /api/health, so a tag that
        # disagrees with the source would publish a release whose own version
        # string is a different release. Fail here instead. (grep, not an inline
        # python -c: nesting quotes inside a YAML block scalar is how this step
        # first shipped — and died on a shell syntax error.)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(grep -m1 -oP '__version__ = "[^"]+"' mlo/__init__.py | cut -d'"' -f2)"
          echo "tag=$VERSION app=$APP_VERSION"
          test -n "$APP_VERSION" || { echo "::error::no __version__ found in mlo/__init__.py"; exit 1; }
          test "$VERSION" = "$APP_VERSION" || {
            echo "::error::tag $GITHUB_REF_NAME does not match mlo/__init__.py ($APP_VERSION)"
            exit 1
          }

      - name: Package application zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="la-musica-${VERSION}"
          mkdir -p "${STAGE}/web"
          cp -r mlo server tools "${STAGE}/"
          cp -r web/dist "${STAGE}/web/dist"
          cp start_app.py tray.py README.md LICENSE THIRD-PARTY-NOTICES.md "${STAGE}"/
          # The Windows entry point is not optional: a renamed/missing launcher
          # must fail the release, not silently ship a zip you cannot start.
          test -f "Start la musica.bat" || {
            echo "::error::Start la musica.bat is missing - the release zip would have no Windows entry point"
            exit 1
          }
          cp "Start la musica.bat" "${STAGE}/"
          zip -qr "la-musica-${VERSION}-windows-x64.zip" "${STAGE}"
          rm -rf "${STAGE}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Collect the desktop and mobile builds
        # The reusable workflows upload their bundles as artifacts of THIS run
        # (a called workflow's artifacts belong to the caller's run), so the
        # installers and the mobile builds ride along with the release instead
        # of expiring in the run's artifact list.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: clients
          merge-multiple: true

      - name: Every platform must be present
        # The release IS the five-platform deliverable, so a missing installer
        # is a failed release, not a warning: without this the publish would
        # quietly leave the previous release's asset in place (same name) and
        # the run would look green.
        run: |
          find clients -type f | sort
          missing=0
          for want in Windows macOS Linux android-debug ios-unsigned; do
            if ! find clients -type f -name "*${want}*" -print -quit | grep -q .; then
              echo "::error::no ${want} build in this release — see the desktop/mobile jobs for why"
              missing=1
            fi
          done
          exit "$missing"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: la musica ${{ github.ref_name }}
          generate_release_notes: true
          # Installers only, by extension: the bundles' own trees carry
          # internals (Info.plist, icon.icns, the bare mlo-desktop binary) and
          # a release that lists those beside the installers reads as clutter
          # and invites the wrong download.
          files: |
            la-musica-*-windows-x64.zip
            clients/**/*.msi
            clients/**/*.exe
            clients/**/*.dmg
            clients/**/*.deb
            clients/**/*.AppImage
            clients/**/*.apk
            clients/**/*.ipa
          draft: false
          prerelease: false
