name: Release

# Creating a v* tag builds the app, publishes a stable GitHub release with
# the packaged zip, and pushes a Docker image to GHCR. The in-app updater
# only ever sees stable (non-draft, non-prerelease) releases, so this
# workflow never creates drafts or prereleases.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci + build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package application zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="MusicLibraryOptimizer-${VERSION}"
          mkdir -p "${STAGE}/web"
          cp -r mlo server tools "${STAGE}/"
          cp -r web/dist "${STAGE}/web/dist"
          cp start_app.py tray.py README.md LICENSE THIRD-PARTY-NOTICES.md "${STAGE}/" 2>/dev/null || true
          [ -f "Start Music Library Optimizer.bat" ] && cp "Start Music Library Optimizer.bat" "${STAGE}/"
          python -m pip download -r server/requirements.txt -d /tmp/wheels --only-binary :all: >/dev/null 2>&1 || true
          echo "${VERSION}" > "${STAGE}/.version"
          zip -qr "MusicLibraryOptimizer-${VERSION}-windows-x64.zip" "${STAGE}"
          rm -rf "${STAGE}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Music Library Optimizer ${{ github.ref_name }}
          generate_release_notes: true
          files: MusicLibraryOptimizer-*-windows-x64.zip
          draft: false
          prerelease: false
