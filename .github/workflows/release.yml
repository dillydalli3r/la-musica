name: Release

# Creating a v* tag runs CI first and only then builds the web frontend,
# publishes a GitHub release with the packaged source zip
# (la-musica-<version>-windows-x64.zip: mlo/, server/, tools/, web/dist,
# start_app.py, tray.py), and pushes a Docker image to GHCR. The tag is checked
# against mlo/__init__.py first: the app reports that version, so a mistagged
# release would ship two different answers to "which version is this?".
# There is no in-app updater (desktop/src-tauri/tauri.conf.json configures no
# updater plugin/endpoints/pubkey), so a release is consumed by downloading
# the zip or pulling the image; the draft/prerelease flags below are just the
# default "this is a real release" choice.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # ci.yml is reusable (workflow_call), so the release can depend on the whole
  # suite: a tag that does not pass CI publishes nothing.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci + build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the app's own version
        # The shipped app reports mlo.__version__ on /api/health, so a tag that
        # disagrees with the source would publish a release whose own version
        # string is a different release. Fail here instead. (grep, not an inline
        # python -c: nesting quotes inside a YAML block scalar is how this step
        # first shipped — and died on a shell syntax error.)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(grep -m1 -oP '__version__ = "[^"]+"' mlo/__init__.py | cut -d'"' -f2)"
          echo "tag=$VERSION app=$APP_VERSION"
          test -n "$APP_VERSION" || { echo "::error::no __version__ found in mlo/__init__.py"; exit 1; }
          test "$VERSION" = "$APP_VERSION" || {
            echo "::error::tag $GITHUB_REF_NAME does not match mlo/__init__.py ($APP_VERSION)"
            exit 1
          }

      - name: Package application zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="la-musica-${VERSION}"
          mkdir -p "${STAGE}/web"
          cp -r mlo server tools "${STAGE}/"
          cp -r web/dist "${STAGE}/web/dist"
          cp start_app.py tray.py README.md LICENSE THIRD-PARTY-NOTICES.md "${STAGE}"/
          # The Windows entry point is not optional: a renamed/missing launcher
          # must fail the release, not silently ship a zip you cannot start.
          test -f "Start la musica.bat" || {
            echo "::error::Start la musica.bat is missing - the release zip would have no Windows entry point"
            exit 1
          }
          cp "Start la musica.bat" "${STAGE}/"
          zip -qr "la-musica-${VERSION}-windows-x64.zip" "${STAGE}"
          rm -rf "${STAGE}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: la musica ${{ github.ref_name }}
          generate_release_notes: true
          files: la-musica-*-windows-x64.zip
          draft: false
          prerelease: false
