name: CI

# Runs on every push and pull request. Three jobs, no third-party actions:
#   python  — installs server/requirements.txt and runs the non-networked
#             tools/test_*.py suites (each exits non-zero on failure, 2 to
#             skip). The browser checks (check_menus.cjs, check_lyrscroll.cjs,
#             check_player_state.cjs, check_sidebar.cjs, check_trash.cjs) and
#             smoke_api.py need a live backend and are not run here.
#   web     — lints and builds the React app, and uploads the built tree as
#             the `web-dist` artifact: the desktop and mobile legs and
#             release.yml's source zip download that rather than building the
#             same frontend again for the same commit.
#   desktop — compiles the Tauri shell (cargo check) and installs its npm
#             dependencies, so the Rust crate graph cannot rot unnoticed.
# release.yml calls this workflow (workflow_call) and only publishes when it
# passed.

on:
  # Branches only: release.yml CALLS this workflow for a tag, so a tag push
  # would otherwise CI the same commit twice — once standalone and once through
  # that call — and the two land in the same `ci-<ref>` concurrency group, so
  # each cancels the other. Which one wins is a race, and losing it cancels the
  # release's own CI jobs, which skips every job that waits on them.
  push:
    tags-ignore: ["**"]
  pull_request:
  workflow_call:

# A pushed commit supersedes the run that is still testing its predecessor:
# three shards of Python suites plus a Rust check are minutes of runner time
# per push, and the older answer is never the one anybody wants.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    # Four shards, dealt by index. The suites are independent scripts, and the
    # slow ones (soulseek, grading, import) dominate the total, so a fixed
    # split keeps every leg within a few minutes of the others without
    # maintaining a per-suite list: a new tools/test_*.py file lands in a
    # shard by itself.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Every version copy agrees
        # mlo/__init__.py is what the app reports, but six other files name a
        # version too, and a release where one was missed ships a build that
        # disagrees with itself. This is the cheap check that catches it on
        # every push instead of at tag time.
        run: python tools/check_versions.py

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r server/requirements.txt

      - name: Install external toolchain for the suites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flac ffmpeg

      - name: Expose the bundled-toolchain layout the suites resolve
        # Several suites look for the bundled encoder at
        # .dependencies/flac*/flac.exe — that folder is version-stamped and
        # gitignored, so on a runner it never exists. Point it at the distro
        # flac instead of letting those suites fail for a missing binary. The
        # folder name comes from fetchdeps' own pin, so bumping the pinned
        # flac version cannot silently break CI with a "missing binary" error.
        run: |
          FLAC_VERSION="$(python -c 'from mlo.fetchdeps import PINNED; print(PINNED["flac"]["version"])')"
          mkdir -p ".dependencies/flac v${FLAC_VERSION}"
          ln -s "$(command -v flac)" ".dependencies/flac v${FLAC_VERSION}/flac.exe"

      - name: Run the test suites (shard ${{ matrix.shard }} of 4)
        run: |
          files=(tools/test_*.py)
          echo "${#files[@]} suites total, this shard runs every 4th"
          fail=0
          ran=0
          for i in "${!files[@]}"; do
            if (( i % 4 != ${{ matrix.shard }} )); then continue; fi
            suite="${files[$i]}"
            ran=$((ran + 1))
            echo "::group::$suite"
            code=0
            # Every suite gets a hard ceiling. Several of them drive thread
            # pools and stub servers, and a wedge there used to sit on the job
            # until GitHub's own six-hour limit — which reads, from the
            # outside, as "CI is slow" rather than "one suite hung". Five
            # minutes is ~50x the slowest suite's local time.
            timeout 300 python "$suite" || code=$?
            if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
              # One retry, then the verdict stands. A handful of these suites
              # exercise thread pools, patched module identities and
              # timing-dependent waits, and on a loaded runner they have been
              # seen to fail once and pass on the next process (the same
              # command passes locally and in most runs) — a flake that has
              # twice taken a whole release run down with it. A real
              # regression is deterministic and fails both attempts, which is
              # the only case that marks the shard red.
              echo "::warning file=$suite::$suite exited $code — retrying once"
              code=0
              timeout 300 python "$suite" || code=$?
            fi
            echo "::endgroup::"
            if [ "$code" -eq 2 ]; then
              echo "SKIP: $suite (local toolchain not available)"
            elif [ "$code" -eq 124 ]; then
              echo "::error file=$suite::$suite hit the 300 s ceiling (hung)"
              fail=1
            elif [ "$code" -ne 0 ]; then
              echo "::error file=$suite::$suite exited $code (twice)"
              fail=1
            fi
          done
          echo "ran $ran suite(s)"
          test "$ran" -gt 0 || { echo "::error::this shard ran nothing"; fail=1; }
          exit "$fail"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npx oxlint

      - name: Type-check and build
        # `npm run build` is already `tsc -b && vite build`, so the type-check
        # and the bundle are one pass here instead of two runs of tsc.
        working-directory: web
        run: npm run build

      - name: Upload the built frontend for the client legs
        # The one build of web/dist for this commit (see the header).
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Lyrics-pane auto-scroll checks
        # web/src/lib/lyrScroll.ts against a fake scroller — the retarget that
        # used to freeze the pane mid-track, and the frame loop that used to
        # outlive an unmounted pane.
        run: node tools/check_lyrscroll.cjs

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri's Linux system dependencies
        # webkit2gtk/gtk/soup are what tauri's build script and its glib-sys,
        # gdk-sys, … bindings link against; without them `cargo check` fails in
        # a build script rather than in our code.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: Cache the Rust crate graph
        # `cargo check` on a cold runner compiles the whole crate graph, which
        # is minutes for four crates of our own. Cached, it is the shell that
        # gets checked.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ci-check

      - name: cargo check
        # The runner image ships a stable Rust toolchain (rustup), so no
        # toolchain action is needed here. Cargo.lock is committed, so this
        # also proves the locked crate graph still resolves.
        working-directory: desktop/src-tauri
        run: cargo check
