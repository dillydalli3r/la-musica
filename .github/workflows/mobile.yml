name: Mobile bundles

# Android APK and iOS IPA. Both jobs generate their native project in CI
# (`tauri android init` / `tauri ios init` write into desktop/src-tauri/gen/),
# because a generated Gradle / Xcode project cannot be maintained, or even
# opened, on a machine without the Android SDK or Xcode — and this repository
# carries none of the SDK, NDK, provisioning profile or signing identity those
# projects need.
#
# Both artifacts are CLIENTS, like every other build of this UI: the same React
# app, pointed at a server the user runs (the Docker container on their own
# machine, or one on the LAN/Tailscale). Nothing here stages a Python runtime
# or a CLI toolchain into the app, and nothing here starts uvicorn — a mobile
# build used to carry its own backend, and that is what this workflow stopped
# doing (see README.md, *Clients*).
#
# Reusable (`release.yml` can call it) and manually dispatchable. Neither job
# builds the React frontend: `tauri build`'s beforeBuildCommand is cleared in
# favour of the web/dist ci.yml built and uploaded for the same commit.

on:
  workflow_dispatch:
  workflow_call:

# See desktop.yml: the same ref must not build twice in parallel.
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Set up JDK 17
        # The Android Gradle Plugin in tauri's generated project expects a
        # JDK 17 toolchain; a newer JDK is what breaks AGP, not the Rust side.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        # The runner image already carries the SDK and its command-line tools,
        # so this only exports ANDROID_HOME (both the generated Gradle project
        # and tauri's Rust→Android linker read it) and installs the platform
        # and build-tools the project asks for.
        #
        # `android-actions/setup-android@v3` is NOT used: it asks sdkmanager
        # for the legacy `tools` package, which no longer exists in the SDK
        # repository, so the whole step dies with exit code 1 ("Failed to find
        # package 'tools'"). Asking for exactly what is needed is what works.
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK" || { echo "::error::no Android SDK on this runner"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          test -n "$SDKMANAGER" || { echo "::error::no sdkmanager under $SDK"; exit 1; }
          # Licences first (the install refuses without them), then the two
          # packages the generated project names.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up the Android NDK
        # The NDK is what cross-links the Rust code for the Android targets
        # (cargo has no linker of its own for those). This is the same action
        # tauri's own CI uses; the version is pinned rather than "latest" so a
        # new NDK release cannot change the build under us.
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: false

      - name: Add the Android Rust target
        # One ABI, and the same one the build below names: an arm64 phone is
        # what this sideload build is for, and four ABI slices of a webview app
        # would be four times the download for three of them nobody asked for.
        run: rustup target add aarch64-linux-android

      - name: Use the frontend ci.yml built
        # The one build of web/dist for this commit; a dispatch of this file
        # alone has none, which the guarded build below covers.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-dist
          path: web/dist

      - name: Build the frontend when this run carried none
        if: hashFiles('web/dist/index.html') == ''
        working-directory: web
        run: npm ci && npm run build

      - name: npm ci (desktop)
        # tauri-cli: the icon generator, the project generators and the build.
        working-directory: desktop
        run: npm ci

      - name: Regenerate the committed icon sets
        # `tauri icon` is the only thing that writes app icons anywhere in this
        # repo. With no generated project in the tree yet it writes the
        # committed sets — `src-tauri/icons/{ios,android}` plus the desktop
        # png/ico/icns — which makes this step the reference copy the icons
        # installed after `init` are compared against below.
        working-directory: desktop
        run: npx tauri icon icon-source.png

      - name: Initialize the Android project
        # Generated, never committed: `--ci` (the runner sets CI anyway) skips
        # the prompts about the package name and target archs.
        working-directory: desktop
        run: npx tauri android init --ci

      - name: Install the app icons into the Android project
        # `android init` renders Tauri's own logo into the generated project
        # (`gen/android/app/src/main/res/mipmap-*`), and nothing else in the
        # toolchain replaces it — which is why an APK built without this step
        # shows Tauri's logo, not la musica's. `tauri icon` prefers the
        # generated project when it exists, so it has to run *after* init.
        #
        # The cmp is the actual assertion: it fails if the generated project
        # still holds the template logo, i.e. if this step ever stops taking
        # effect. PNGs are written deterministically by the pinned CLI, so the
        # reference copy from two steps up matches byte for byte.
        working-directory: desktop
        run: |
          npx tauri icon icon-source.png
          cmp -s src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png \
                 src-tauri/icons/android/mipmap-xxxhdpi/ic_launcher_foreground.png \
            || { echo "::error::the generated Android project does not carry the la musica icons"; exit 1; }

      - name: Pin the generated project to one ABI
        # The generated project lists several ABIs and the packaging step fails
        # on a slice nothing built — the build below asks for aarch64 alone, so
        # the project is told the same thing. `gen/android` is never committed,
        # so this is a workflow edit rather than a repo one; the keys are edited
        # where they exist and appended where they do not, so it holds whichever
        # shape tauri-cli's template has.
        working-directory: desktop
        run: |
          props=src-tauri/gen/android/gradle.properties
          if grep -qE '^(abiList|targetList)=' "$props"; then
            sed -i -E 's/^(abiList|targetList)=.*/\1=arm64-v8a/' "$props"
          else
            printf '\n# One ABI: the build asks for aarch64 alone.\nabiList=arm64-v8a\ntargetList=arm64-v8a\n' >> "$props"
          fi
          grep -q '^abiList=arm64-v8a' "$props" && grep -q '^targetList=arm64-v8a' "$props" \
            || { echo "::error::could not pin $props to arm64-v8a"; exit 1; }

      - name: Allow plain-http servers in the release build type
        # Tauri v2 has no config key for Android's cleartext policy, and the
        # generated project is not committed, so the switch lives here. The
        # generated `app/build.gradle.kts` sets the `usesCleartextTraffic`
        # manifest placeholder to "false" for every build type and to "true"
        # only for debug, while a la musica server on a LAN address, a Tailscale
        # name or 127.0.0.1 is plain http — a release APK would otherwise
        # refuse every request the webview makes
        # (net::ERR_CLEARTEXT_NOT_PERMITTED on API 28+). This permits nothing
        # but the http the app exists to talk to: the app ships no other
        # network client. desktop/README.md names the same one-liner for a
        # release build done outside CI.
        working-directory: desktop
        run: |
          gradle=src-tauri/gen/android/app/build.gradle.kts
          sed -i 's/\["usesCleartextTraffic"\] = "false"/["usesCleartextTraffic"] = "true"/' "$gradle"
          if grep -q 'usesCleartextTraffic"\] = "false"' "$gradle"; then
            echo "::error::could not allow cleartext traffic in $gradle"
            exit 1
          fi

      - name: Cache the Rust crate graph
        # The cross-compile of every dependency for the Android ABI is what
        # makes this job long; the cache takes it back to compiling just the
        # shell. Keyed by NDK version as well, because the linker inputs
        # change with it.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: android-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Build the APK
        # `--debug` on purpose: a debug APK is signed with the SDK's debug
        # keystore and therefore INSTALLS on a device, while a release APK is
        # only signed when gen/android/keystore.properties exists — a keystore
        # generated locally and never committed, so a release build here would
        # be an unsigned APK no phone will install. A release APK is one
        # keystore away: add the signing config and swap the flag.
        #
        # `--target aarch64` is what decides the ABI list, and it is the only
        # one built above: a phone install of a client does not need x86 slices.
        #
        # `--config` clears beforeBuildCommand — the frontend this job wrapped
        # is already in web/dist, so the hook must not build a second one.
        working-directory: desktop
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npx tauri android build --apk --debug --target aarch64 --config '{"build":{"beforeBuildCommand":null}}'

      - name: Verify the icons inside the built APK
        # The launcher rasters are copied out of `icons/android/**` by the
        # Android toolchain, so a build that embedded stale or placeholder
        # artwork is invisible in the repo and obvious on the phone's home
        # screen. Same script, same metric as the iOS check below — a cat
        # cannot ship as a play triangle on either platform without this job
        # going red.
        working-directory: desktop
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          test -n "$APK" || { echo "::error::the build produced no .apk to inspect"; exit 1; }
          echo "inspecting $APK"
          python3 ../tools/bundle_icons.py --apk "$APK"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: la-musica-android-debug
          if-no-files-found: error
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Ensure CocoaPods
        # tauri ios init generates the Xcode project; its dependencies are
        # resolved by CocoaPods, which the runner image already ships. Guarded
        # so an image without it still builds.
        run: command -v pod >/dev/null || brew install cocoapods

      - name: Add the iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Use the frontend ci.yml built
        # See the Android job: the one build of web/dist for this commit, with
        # the guarded build below for a run that carried none.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-dist
          path: web/dist

      - name: Build the frontend when this run carried none
        if: hashFiles('web/dist/index.html') == ''
        working-directory: web
        run: npm ci && npm run build

      - name: npm ci (desktop)
        # tauri-cli: the icon generator, the project generators and the build.
        working-directory: desktop
        run: npm ci

      - name: Regenerate the committed icon sets
        # See the Android job: with no generated project in the tree,
        # `tauri icon` writes the committed sets, which is both what the
        # AppIcon assertion below compares against and how the committed
        # `src-tauri/icons/ios/` set stays current.
        working-directory: desktop
        run: npx tauri icon icon-source.png

      - name: Initialize the iOS project
        working-directory: desktop
        run: npx tauri ios init --ci

      - name: Install the app icons into the Xcode project
        # `ios init` copies Tauri's own logo into
        # `gen/apple/Assets.xcassets/AppIcon.appiconset`, and the Xcode build
        # reads the app icon from there — never from `bundle.icon`, which only
        # feeds the desktop bundles. Hence the shipping IPA had Tauri's logo
        # (or no icon at all) until `tauri icon` ran here: it prefers the
        # generated project when it exists, so it has to run *after* init.
        #
        # The cmp asserts the set really is ours: PNGs are written
        # deterministically by the pinned CLI, so it matches the reference copy
        # generated before init — and fails if the template logo is still in
        # place.
        working-directory: desktop
        run: |
          npx tauri icon icon-source.png
          iconset=src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset
          for icon in AppIcon-20x20@1x.png AppIcon-29x29@1x.png AppIcon-40x40@2x.png \
                      AppIcon-60x60@2x.png AppIcon-76x76@2x.png AppIcon-512@2x.png; do
            cmp -s "$iconset/$icon" "src-tauri/icons/ios/$icon" \
              || { echo "::error::$iconset/$icon is not the la musica icon"; exit 1; }
          done

      - name: Cache the Rust crate graph
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ios-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Build the unsigned app
        # No signing identity here: the repository carries no Apple
        # certificate, provisioning profile or team id, and an unsigned build
        # is all that can be produced from them without a secret. `--no-sign`
        # skips the whole export/signing stage, and the CODE_SIGNING_* vars
        # disable it inside xcodebuild as well (belt and braces: the flag only
        # exists from tauri-cli 2.11, which desktop/package-lock.json pins).
        working-directory: desktop
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        # tauri's own target names, not cargo's: `aarch64` is the device
        # (arm64-apple-ios), `aarch64-sim`/`x86_64` the simulators. Passing the
        # cargo triple here is rejected outright ("invalid value
        # 'aarch64-apple-ios'"), which is what failed the first CI run.
        #
        # `--config` clears beforeBuildCommand, so the web/dist this job
        # downloaded is what the app is built around.
        run: npx tauri ios build --target aarch64 --no-sign --config '{"build":{"beforeBuildCommand":null}}'

      - name: Verify the icons inside the built app
        # The two `cmp` assertions above compare the *generated Xcode project*
        # with the committed reference set; they say nothing about what the
        # compiler and the asset pipeline actually put inside the .app the user
        # installs. That gap is what this step closes: `tools/bundle_icons.py`
        # opens the built bundle and compares every loose AppIcon*.png in it to
        # the committed reference of the same name. It reads Apple's
        # `pngcrush -iphone` PNGs itself (CgBI chunk, raw-deflate IDAT,
        # premultiplied BGRA) because no stock reader takes them and Pillow
        # cannot be pip-installed into the runner's Homebrew Python (PEP 668),
        # and it applies the metric `tools/test_icons.py` documents. The same
        # script checks the Android APK above, from the same decoder.
        working-directory: desktop
        run: |
          APP="$(find src-tauri/gen/apple/build -maxdepth 6 -name '*.app' -type d | head -1)"
          test -n "$APP" || { echo "::error::the build produced no .app to inspect"; exit 1; }
          echo "inspecting $APP"
          python3 ../tools/bundle_icons.py --app "$APP"

      - name: Package the .app into an unsigned .ipa
        # An .ipa is a zip with the app bundle inside a Payload/ directory and
        # nothing else — no signing identity is involved in producing one.
        #
        # `tauri ios build` already writes its own IPA (an ad-hoc-signed one
        # under gen/apple/build/arm64/<name>.ipa), so that is used when it
        # exists. Otherwise the .app is packaged by hand: the CLI archives to
        # <build>/<scheme>.xcarchive/Products/Applications/<name>.app, i.e.
        # four levels below gen/apple/build — a shallower search finds nothing
        # and fails the job, which would block the whole release.
        working-directory: desktop
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          OUT="la-musica_${VERSION}_ios-unsigned.ipa"
          BUILT="$(find src-tauri/gen/apple/build -maxdepth 3 -name '*.ipa' -type f | head -1)"
          if [ -n "$BUILT" ]; then
            echo "using the IPA the CLI produced: $BUILT"
            cp "$BUILT" "$OUT"
          else
            APP="$(find src-tauri/gen/apple/build -maxdepth 6 -name '*.app' -type d | head -1)"
            test -n "$APP" || { echo "::error::tauri ios build produced no .app"; exit 1; }
            rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
            zip -qry "$OUT" Payload
            rm -rf Payload
          fi
          ls -l "$OUT"

      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: la-musica-ios-unsigned
          if-no-files-found: error
          path: desktop/la-musica_*_ios-unsigned.ipa
