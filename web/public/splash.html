<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>la musica</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #0b0b0d;
        color: #d4d4d8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: grid; place-items: center;
      }
      /* The window has no OS title bar (tauri.conf.json `decorations: false`),
         so this page has to carry its own — otherwise the few seconds of boot
         are a window that cannot be moved. The app's own title bar
         (components/TitleBar.tsx) replaces this the moment the app paints;
         until then this strip is the only drag surface there is, and it is
         what `data-tauri-drag-region` is for. */
      .titlebar {
        position: fixed; inset: 0 0 auto 0; height: 32px;
        background: #0a0a0c;
        display: flex; align-items: center; gap: 8px; padding-left: 12px;
        font-size: 11px; font-weight: 600; letter-spacing: -0.011em; color: #71717a;
        user-select: none;
      }
      .titlebar img { width: 16px; height: 16px; border-radius: 3px; }
      /* The one control the boot page keeps: a way out of a boot that never
         finishes. Same box and the same red hover as the app's own bar. */
      .titlebar #close {
        margin-left: auto; width: 44px; height: 32px; border: 0; padding: 0;
        background: transparent; color: #a1a1aa; cursor: pointer;
        font: inherit; font-size: 12px; line-height: 1;
      }
      .titlebar #close:hover { background: #dc2626; color: #fff; }
      .brand { font-size: 22px; font-weight: 700; letter-spacing: 0.02em; color: #fafafa; }
      .row { display: flex; align-items: center; gap: 14px; }
      .spinner {
        width: 16px; height: 16px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.22);
        border-top-color: #fff;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .msg { margin-top: 12px; font-size: 13px; color: #a1a1aa; }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region="deep">
      <img src="/icon.png" alt="" />
      <span>la musica</span>
      <button id="close" title="Close" aria-label="Close">&#10005;</button>
    </div>
    <div>
      <div class="row"><span class="spinner"></span><span class="brand">la musica</span></div>
      <div class="msg">Starting the local server…</div>
    </div>
    <script>
      // The boot page needs a way OUT: with no OS title bar there is nothing
      // else on it to click. The IPC is reached directly because this page
      // ships no app bundle — and the click is a no-op when there is no shell
      // to reach (the page opened in a plain browser).
      document.getElementById("close").addEventListener("click", () => {
        window.__TAURI_INTERNALS__?.invoke("plugin:window|close");
      });
    </script>
    <!-- This page is shown for the brief first paint while the shell boots its
         bundled backend (mlo-server). It is replaced by the app the moment
         /api/health answers; if the server cannot start, the app's own error
         UI takes over. The page is static on purpose — no app code, no API
         calls, so there is never a "can't reach this page" flash. -->
  </body>
</html>
