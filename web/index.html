<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- The same picture on the two home screens a browser draws for an
         installed web app: iOS Safari reads `apple-touch-icon` (it ignores the
         manifest's icons), everything else reads the manifest. The service
         worker precaches anything index.html names, so both come offline with
         the shell — `sw.js` already matches `/icon.png`, `*.webmanifest`. -->
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0c" />
    <!-- Full-height app shell (App.tsx is `h-screen overflow-hidden`).
         `interactive-widget=resizes-visual` keeps the on-screen keyboard from
         resizing the LAYOUT viewport: 100vh keeps describing the whole screen,
         so a focus does not reflow the entire shell (library, player bar) —
         the keyboard moves the visual viewport instead, which the browser
         pans to reach the field being edited.
         `viewport-fit=cover` paints edge to edge; index.css's `.safe-shell`
         and `.safe-drawer` carry the matching env(safe-area-inset-*) padding,
         so the notched strip stays clear of the shell's own chrome.
         Zoom: pinch-zoom is OFF (`maximum-scale=1, user-scalable=no`) and the
         app offers an explicit scale instead — the `mlo.zoom` preference
         (80–150%), applied as a root font size in main.tsx and set in
         Settings. That scale is the substitute for pinch, not a replacement
         for the BROWSER's own text scaling: nothing here sets
         `text-size-adjust`, so a device's accessibility font size still
         enlarges the text. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />
    <title>la musica</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
